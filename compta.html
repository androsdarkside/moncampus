<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comptabilité - Mon Campus</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 { color: #2c3e50; }
        
        /* Style du tableau */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th { background-color: #f8f9fa; color: #34495e; }
        
        /* Style des liens et images */
        .lien-fichier {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        .lien-fichier:hover { text-decoration: underline; }
        
        /* Boutons d'action */
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            margin-right: 5px;
        }
        .btn-valider { background-color: #2ecc71; }
        .btn-valider:hover { background-color: #27ae60; }
        .btn-rejeter { background-color: #e74c3c; }
        .btn-rejeter:hover { background-color: #c0392b; }
        
        #chargement { text-align: center; font-style: italic; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Espace Comptabilité - Validation des reçus</h1>
    <p>Liste des paiements en attente de vérification :</p>

    <div id="chargement">Chargement des reçus depuis la base de données...</div>

    <table id="tableau-recus" style="display: none;">
        <thead>
            <tr>
                <th>Date</th>
                <th>Matricule</th>
                <th>Couvre</th>
                <th>Détails de l'étudiant</th>
                <th>Fichier joint</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="corps-tableau">
            <!-- Les lignes apparaîtront ici automatiquement -->
        </tbody>
    </table>
</div>

<script>
    // 1. CONFIGURATION DE SUPABASE (Remplace par tes vraies clés !)
    const supabaseUrl = 'TON_URL_SUPABASE_ICI'; 
    const supabaseKey = 'TA_CLE_ANON_ICI';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    const chargementDiv = document.getElementById('chargement');
    const tableau = document.getElementById('tableau-recus');
    const corpsTableau = document.getElementById('corps-tableau');

    // 2. FONCTION POUR RÉCUPÉRER ET AFFICHER LES DONNÉES
    async function chargerRecus() {
        try {
            // On demande à Supabase de nous donner tous les reçus "En attente"
            const { data: recus, error } = await supabase
                .from('recus_paiement')
                .select('*')
                .eq('statut', 'En attente') // On filtre pour ne voir que ceux à traiter
                .order('created_at', { ascending: false }); // Du plus récent au plus ancien

            if (error) throw error;

            chargementDiv.style.display = 'none'; // On cache le texte de chargement
            tableau.style.display = 'table'; // On affiche le tableau

            corpsTableau.innerHTML = ''; // On vide le tableau avant de le remplir

            if (recus.length === 0) {
                corpsTableau.innerHTML = '<tr><td colspan="6" style="text-align:center;">Aucun reçu en attente de validation. 🎉</td></tr>';
                return;
            }

            // On crée une ligne de tableau pour chaque reçu trouvé
            recus.forEach(recu => {
                // Formatage de la date pour la rendre lisible
                const datePropre = new Date(recu.created_at).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                const ligne = document.createElement('tr');
                ligne.innerHTML = `
                    <td>${datePropre}</td>
                    <td><strong>${recu.etudiant_matricule}</strong></td>
                    <td>${recu.types_paiement}</td>
                    <td>${recu.details}</td>
                    <td><a href="${recu.fichier_url}" target="_blank" class="lien-fichier">📄 Voir le reçu</a></td>
                    <td>
                        <button class="btn btn-valider" onclick="changerStatut(${recu.id}, 'Validé')">✅ Valider</button>
                        <button class="btn btn-rejeter" onclick="changerStatut(${recu.id}, 'Rejeté')">❌ Rejeter</button>
                    </td>
                `;
                corpsTableau.appendChild(ligne);
            });

        } catch (erreur) {
            console.error("Erreur de chargement :", erreur);
            chargementDiv.innerHTML = `<span style="color:red;">Erreur lors du chargement des données.</span>`;
        }
    }

    // 3. FONCTION POUR CHANGER LE STATUT (Valider ou Rejeter)
    async function changerStatut(idReçu, nouveauStatut) {
        // Demande de confirmation pour éviter les erreurs de clic
        if (!confirm(`Voulez-vous vraiment marquer ce reçu comme ${nouveauStatut} ?`)) return;

        try {
            // On met à jour la ligne dans la base de données
            const { error } = await supabase
                .from('recus_paiement')
                .update({ statut: nouveauStatut })
                .eq('id', idReçu);

            if (error) throw error;

            alert(`Le reçu a bien été ${nouveauStatut}.`);
            chargerRecus(); // On recharge le tableau pour faire disparaître la ligne traitée

        } catch (erreur) {
            console.error("Erreur de mise à jour :", erreur);
            alert("Une erreur est survenue lors de la mise à jour.");
        }
    }

    // 4. On lance le chargement dès l'ouverture de la page
    chargerRecus();

</script>
</body>
</html>
